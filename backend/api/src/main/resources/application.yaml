spring:
  application:
    name: api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  
app:
  cors:
    allowed-origins: http://localhost:5173