spring:
  application:
    name: api

  config:
    # O caminho do .env é relativo ao diretório de execução:
    # - rodando de backend/api (mvnw spring-boot:run) -> .env
    # - rodando pelo IntelliJ com o projeto aberto na raiz do repo -> backend/api/.env
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/api/.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  
app:
  cors:
    # origem do front Next.js (pnpm dev). Para mais de uma, separe por vírgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}